aid: ello
name: Ello
description: >-
  Ello is a public-benefit AI education company building a 1:1 AI reading and
  math tutor for children ages 4-9. Its consumer app pairs proprietary
  child-speech recognition (trained on 100K+ hours of kids' audio) with
  generative AI and adaptive teaching agents to deliver personalized,
  sub-second, voice-based reading instruction grounded in the Science of
  Reading, plus a large catalog of leveled e-books, a "Storytime"
  create-your-own story feature, and parent progress reports. Recognized as one
  of TIME's Best Inventions of 2024 and backed by Y Combinator, Goodwater,
  Project A, and Homebrew, Ello is a consumer (B2C) product with no public
  developer API program at this time.
